<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>굿즈 & 푸드트럭 | FESTIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>

<body>
  <header class="site-header" id="siteHeader"></header>

  <main>

    <!-- ── HERO ── -->
    <section class="hero" aria-label="메인 배너">
      <div class="container">
        <div class="hero-inner">

          <div class="hero-left">
            <div class="hero-tag">
              <span class="hero-tag-dot"></span>
              <span>FESTIO × 2026 Summer</span>
            </div>
            <h1 class="hero-h1">축제 현장에서<br /><em>지금 바로</em> 주문</h1>
            <p class="hero-desc">한정판 굿즈 · 아티스트 컬래버 · 현장 푸드트럭<br />QR 하나로 주문하고 바로 수령하세요</p>
          </div>

          <div class="hero-right">
            <div class="hero-stats">
              <div class="hero-stat">
                <div class="hero-stat-icon ico-red" aria-hidden="true">
                  <!-- Image 2: Storefront with SHOP sign -->
                  <svg width="24" height="24" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"
                    stroke-linejoin="round" stroke-linecap="round">
                    <rect x="25" y="10" width="50" height="22" rx="4" />
                    <text x="50" y="27" font-family="sans-serif" font-weight="bold" font-size="16" fill="currentColor"
                      stroke="none" text-anchor="middle">SHOP</text>
                    <path d="M20 40 L80 40 L85 52 L15 52 Z" />
                    <rect x="15" y="52" width="70" height="38" />
                    <rect x="22" y="60" width="20" height="30" />
                    <rect x="48" y="60" width="30" height="15" />
                    <path d="M10 90 L90 90" />
                  </svg>
                </div>
                <div class="hero-stat-info">
                  <div class="hero-stat-num" id="stat-store-cnt">0</div>
                  <div class="hero-stat-label">입점 상점</div>
                </div>
              </div>
              <div class="hero-stat">
                <div class="hero-stat-icon ico-orange" aria-hidden="true">
                  <!-- Image 1: Shopping Bag & Shirt -->
                  <svg width="24" height="24" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"
                    stroke-linejoin="round" stroke-linecap="round">
                    <path d="M35 15 L70 15 L85 30 L65 40 L65 80 L50 80" />
                    <circle cx="55" cy="35" r="5" />
                    <path d="M50 45 L60 45" />
                    <rect x="15" y="45" width="35" height="45" rx="4" />
                    <path d="M22 45 V30 A 10 10 0 0 1 42 30 V45" />
                    <path d="M27 45 V25 A 5 5 0 0 1 37 25 V45" />
                    <circle cx="32" cy="65" r="6" />
                    <path d="M27 78 L37 78" />
                  </svg>
                </div>
                <div class="hero-stat-info">
                  <div class="hero-stat-num" id="stat-product-cnt">0</div>
                  <div class="hero-stat-label">총 상품</div>
                </div>
              </div>
              <div class="hero-stat">
                <div class="hero-stat-icon ico-purple" aria-hidden="true">
                  <!-- Image 3: Food Truck with FOOD sign -->
                  <svg width="24" height="24" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"
                    stroke-linejoin="round" stroke-linecap="round">
                    <rect x="35" y="10" width="45" height="20" rx="6" />
                    <text x="57" y="26" font-family="sans-serif" font-weight="bold" font-size="15" fill="currentColor"
                      stroke="none" text-anchor="middle">FOOD</text>
                    <path d="M35 30 L85 30 L85 75 L15 75 L15 55 L25 55 L35 30" />
                    <rect x="45" y="40" width="30" height="20" />
                    <path d="M45 40 Q 48 45 52 40 Q 56 45 60 40 Q 64 45 68 40 Q 72 45 75 40" />
                    <circle cx="30" cy="80" r="8" />
                    <circle cx="70" cy="80" r="8" />
                    <rect x="52" y="50" width="15" height="10" />
                  </svg>
                </div>
                <div class="hero-stat-info">
                  <div class="hero-stat-num" id="stat-food-cnt">0</div>
                  <div class="hero-stat-label">푸드트럭</div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ── 카테고리 탭 ── -->
    <nav class="cat-strip" aria-label="카테고리">
      <div class="container">
        <button class="cat-btn on" data-cat="all">
          <span class="cat-dot cat-dot-all"></span>전체보기
        </button>
        <button class="cat-btn" data-cat="food">
          <span class="cat-dot cat-dot-food"></span>푸드트럭 메뉴
        </button>
        <button class="cat-btn" data-cat="goods">
          <span class="cat-dot cat-dot-goods"></span>공식 굿즈
        </button>
        <button class="cat-btn" data-cat="collab">
          <span class="cat-dot cat-dot-collab"></span>아티스트 컬래버
        </button>
      </div>
    </nav>

    <!-- ── 필터 바 ── -->
    <div class="filter-bar">
      <div class="container">
        <div class="filter-tags" role="group" aria-label="필터">
          <button class="ftag on" data-cat="all">전체</button>
          <button class="ftag" data-cat="food">푸드트럭</button>
          <button class="ftag" data-cat="goods">굿즈</button>
          <button class="ftag" data-cat="collab">컬래버</button>
        </div>
        <label class="sr-only" for="sortSel">정렬</label>
        <select class="sort-sel" id="sortSel">
          <option value="popular">인기순</option>
          <option value="newest">최신순</option>
          <option value="price_asc">가격 낮은 순</option>
          <option value="price_desc">가격 높은 순</option>
        </select>
      </div>
    </div>

    <!-- ── 상품 그리드 ── -->
    <section class="grid-section">
      <div class="container">
        <div class="grid-meta">
          <span class="grid-count" id="gridCount">총 0개 상품</span>
        </div>
        <div class="prod-grid" id="prodGrid"></div>
        <div class="empty" id="gridEmpty" style="display:none" role="status">
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
            <circle cx="26" cy="26" r="22" stroke="currentColor" stroke-width="2" />
            <path d="M18 26h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <p>상품이 없어요</p>
          <span>다른 카테고리나 검색어를 시도해보세요</span>
        </div>
      </div>
    </section>

  </main>

  <span class="sr-only" aria-live="polite" id="srMsg"></span>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>

</html>
