<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>장바구니 | FESTIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/cart.css" />
</head>

<body class="cart-pg">
  <header class="site-header" id="siteHeader"></header>
  <main>
    <div class="container">
      <div class="pg-head">
        <h1 class="pg-title">장바구니</h1>
        <span class="pg-count" id="cartCount">0개 상품</span>
      </div>

      <div class="empty" id="cartEmpty" style="display:none">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <path d="M4 7h6l7 25a5 5 0 0 0 5 3.5H48" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M20 7h34l-4 19H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="24" cy="48" r="4" fill="currentColor" />
          <circle cx="44" cy="48" r="4" fill="currentColor" />
        </svg>
        <p>장바구니가 비어있어요</p>
        <span>마음에 드는 상품을 담아보세요</span>
        <a href="shop.html" class="btn-go-shop">쇼핑 계속하기</a>
      </div>

      <div class="cart-layout" id="cartLayout">
        <div>
          <div class="cart-sel-bar">
            <label class="chk-wrap"><input type="checkbox" id="chkAll" checked /><span class="chk-box"></span><span>전체
                선택</span></label>
            <button class="btn-del-sel" id="btnDelSel">선택 삭제</button>
          </div>
          <div id="cartList"></div>
          <a href="shop.html" class="btn-cont">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            쇼핑 계속하기
          </a>
        </div>
        <div>
          <div class="sum-card" style="position:sticky;top:calc(var(--header-h) + 20px)">
            <div class="sum-title">주문 요약</div>
            <div class="sum-row"><span>상품 금액</span><span id="sumGoods">0원</span></div>
            <div class="sum-row"><span>배송비</span><span>현장 수령 무료</span></div>
            <div class="sum-hr"></div>
            <div class="sum-row sum-total"><span>합계</span><span id="sumTotal">0원</span></div>
            <button class="btn-order" id="btnOrder">주문하기</button>
            <!-- FESTIO 연동 포인트: festio.order.create() -->
            <p class="sum-note">FESTIO 결제 시스템과 연동됩니다</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase_client.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>

</html>
