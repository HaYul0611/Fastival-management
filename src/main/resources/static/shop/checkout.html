<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>결제 | FESTIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <!-- PortOne (iamport) SDK -->
  <script defer src="https://cdn.iamport.kr/v1/iamport.js"></script>
  <!-- Daum Postcode API -->
  <script defer src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <!-- Toss Payments SDK -->
  <script defer src="https://js.tosspayments.com/v1/payment"></script>
</head>

<body class="co-pg">
  <header class="site-header" id="siteHeader"></header>
  <main>
    <div class="container">
      <div class="pg-head">
        <h1 class="pg-title">결제하기</h1>
      </div>
      <div class="co-layout">
        <div>
          <div class="co-sec">
            <div class="co-sec-title">수령 정보</div>
            <div class="co-notice">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
                <path d="M8 7v5M8 5.5h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              FESTIO 회원 정보가 자동 연동됩니다
            </div>
            <div class="fgrp"><label class="flabel" for="rcvName">수령인</label><input class="finput" type="text"
                id="rcvName" placeholder="이름" /></div>
            <div class="fgrp"><label class="flabel" for="rcvPhone">연락처</label><input class="finput" type="tel"
                id="rcvPhone" placeholder="010-0000-0000" /></div>
            <div class="fgrp"><label class="flabel">수령 방법</label>
              <select id="rcvMethod" style="display:none;">
                <option value="onsite">현장 수령</option>
                <option value="delivery">배송 수령</option>
              </select>
              <div class="custom-select" id="customRcvMethod" style="position:relative; width:100%;">
                <div class="select-selected"
                  style="height:44px; padding:0 14px; border:1.5px solid var(--g200); border-radius:var(--r12); font-size:14px; color:var(--g900); background:var(--white) url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22 viewBox=%220 0 10 6%22%3E%3Cpath d=%22M1 1l4 4 4-4%22 stroke=%22%23737373%22 stroke-width=%221.3%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E') no-repeat right 14px center; display:flex; align-items:center; cursor:pointer;">
                  현장 수령
                </div>
                <div class="select-items"
                  style="display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--white); border:1.5px solid var(--g200); border-radius:var(--r12); z-index:99; box-shadow:var(--sh2); overflow:hidden;">
                  <div data-val="onsite"
                    style="padding:12px 14px; font-size:14px; color:var(--g900); cursor:pointer; transition:background var(--trans);">
                    현장 수령</div>
                  <div data-val="delivery"
                    style="padding:12px 14px; font-size:14px; color:var(--g900); cursor:pointer; transition:background var(--trans); border-top:1px solid var(--g100);">
                    배송 수령</div>
                </div>
              </div>
            </div>

            <div class="fgrp" id="addressGroup" style="display:none; margin-top:16px;">
              <label class="flabel">배송지 주소</label>
              <div style="display:flex; gap:8px; margin-bottom:8px;">
                <input class="finput" type="text" id="postcode" placeholder="우편번호" readonly
                  style="flex:1; background:#f9fafb; cursor:pointer;" onclick="execDaumPostcode()">
                <button type="button" class="btn-postcode" onclick="execDaumPostcode()"
                  style="padding:0 16px; border:none; border-radius:8px; background:var(--black); color:#fff; font-size:13px; font-weight:bold; cursor:pointer;">주소
                  검색</button>
              </div>
              <input class="finput" type="text" id="address1" placeholder="기본 주소" readonly
                style="margin-bottom:8px; background:#f9fafb;" />
              <input class="finput" type="text" id="address2" placeholder="상세 주소를 입력해주세요" />
            </div>
          </div>

          <div class="co-sec">
            <div class="co-sec-title">결제 수단</div>
            <div class="co-notice">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
                <path d="M8 7v5M8 5.5h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              FESTIO 결제 API (PortOne / 토스페이먼츠) 연동 예정
            </div>
            <div class="pay-opts">
              <label class="pay-opt"><input type="radio" name="pay" value="card" checked />
                <span class="pay-opt-lbl">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5" />
                    <path d="M2 9h16M6 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                  신용 / 체크카드
                </span>
              </label>
              <label class="pay-opt"><input type="radio" name="pay" value="kakao" />
                <span class="pay-opt-lbl">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                      d="M10 3C6.13 3 3 5.68 3 8.97c0 2.1 1.3 3.95 3.28 5.09L5.5 17l3.36-2.22c.37.06.75.09 1.14.09 3.87 0 7-2.68 7-5.97S13.87 3 10 3z"
                      fill="#3A1D1D" />
                  </svg>
                  카카오페이
                </span>
              </label>
              <label class="pay-opt"><input type="radio" name="pay" value="toss" />
                <span class="pay-opt-lbl">
                  <img src="img/toss_icon.png" alt="토스페이" width="20" height="20"
                    style="object-fit: contain; border-radius: 5px;">
                  토스페이
                </span>
              </label>
              <label class="pay-opt"><input type="radio" name="pay" value="festiopay" />
                <span class="pay-opt-lbl">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="9" stroke="#FF2D55" stroke-width="1.5" />
                    <path d="M10 5v10M6 10h8" stroke="#FF2D55" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                  FESTIO Pay
                </span>
              </label>
              <!-- FESTIO Pay 잔액 표시 영역 (숨김) -->
              <div id="festioPayBalanceArea"
                style="display:none; padding:12px; background:var(--g50); border-radius:8px; margin-top:8px; border:1px solid var(--g200);">
                <div style="display:flex; justify-content:space-between; align-items:center; font-size:14px;">
                  <span style="color:var(--g700); font-weight:600;">내 FESTIO Pay 잔액</span>
                  <span id="festioPayBalanceText" style="color:var(--black); font-weight:800; font-size:15px;">조회
                    중...</span>
                </div>
                <div id="festioPayShortageMsg"
                  style="display:none; font-size:12px; color:var(--red); margin-top:8px; text-align:right;">
                  <span id="shortageAmountText"></span> 부족합니다.
                </div>

                <div id="rechargePanel" style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--g300);">
                  <div style="font-size:13px; font-weight:700; color:var(--g800); margin-bottom:8px;">충전하기</div>
                  <!-- 빠른 선택 버튼 -->
                  <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:8px;">
                    <button type="button" class="qp-btn" data-amt="10000"
                      style="padding:8px 0; font-size:12px; font-weight:600; color:var(--g700); background:var(--white); border:1px solid var(--g200); border-radius:4px; cursor:pointer;">1만원</button>
                    <button type="button" class="qp-btn" data-amt="30000"
                      style="padding:8px 0; font-size:12px; font-weight:600; color:var(--g700); background:var(--white); border:1px solid var(--g200); border-radius:4px; cursor:pointer;">3만원</button>
                    <button type="button" class="qp-btn" data-amt="50000"
                      style="padding:8px 0; font-size:12px; font-weight:600; color:var(--g700); background:var(--white); border:1px solid var(--g200); border-radius:4px; cursor:pointer;">5만원</button>
                    <button type="button" class="qp-btn" data-amt="100000"
                      style="padding:8px 0; font-size:12px; font-weight:600; color:var(--g700); background:var(--white); border:1px solid var(--g200); border-radius:4px; cursor:pointer;">10만원</button>
                  </div>
                  <!-- 직접 입력 & 버튼 -->
                  <div style="display:flex; gap:8px;">
                    <div style="flex:1; position:relative;">
                      <input type="text" id="chargeInput" class="finput" placeholder="금액 입력"
                        style="height:40px; padding-right:24px; text-align:right; font-weight:600;" />
                      <span
                        style="position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--g500);">원</span>
                    </div>
                    <button type="button" id="btnQuickCharge"
                      style="width:80px; height:40px; border:none; border-radius:4px; background:var(--red); color:var(--white); cursor:pointer; font-size:13px; font-weight:bold;">
                      충전 결제
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="co-sec">
            <div class="co-sec-title">주문 메모 <span style="font-size:12px;font-weight:400;color:var(--g400)">(선택)</span>
            </div>
            <textarea class="finput co-memo" id="orderMemo" placeholder="요청사항 (예: 소스 빼주세요)" rows="3"
              style="height:auto;resize:vertical;padding:12px 14px"></textarea>
          </div>
        </div>

        <div>
          <div class="sum-card" style="position:sticky;top:calc(var(--header-h)+20px)">
            <div class="sum-title">최종 결제 금액</div>
            <div id="coItemList"></div>
            <div class="sum-hr"></div>
            <div class="sum-row"><span>상품 금액</span><span id="coGoods">0원</span></div>
            <div class="sum-row" id="coDiscountRow" style="display:none; color:var(--red);">
              <span>멤버십 할인 (<span id="coDiscountGrade">BRONZE</span>)</span>
              <span id="coDiscountAmount">-0원</span>
            </div>
            <div class="sum-row"><span>배송비</span><span>무료</span></div>
            <div class="sum-hr"></div>
            <div class="sum-row sum-total"><span>최종 결제</span><span id="coTotal">0원</span></div>
            <button class="btn-order" id="btnPay">결제하기</button>
            <!-- FESTIO 연동 포인트: festio.payment.request() -->
            <p class="sum-note">결제 완료 시 FESTIO 앱에서 QR이 발급됩니다</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>

</html>
