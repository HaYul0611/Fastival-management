<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>로그인 — FESTIO SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body class="login-pg">
  <div class="login-layout">

    <!-- 브랜드 패널 -->
    <aside class="login-brand" aria-hidden="true">
      <div class="lb-inner">
        <div class="lb-logo">
          <div class="lb-logo-mark">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <path d="M5 7h18M5 14h13M5 21h15" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="23" cy="21" r="3.5" fill="#fff" />
            </svg>
          </div>
          <div>
            <div class="lb-name">FESTIO</div>
            <div class="lb-sub">SHOP</div>
          </div>
        </div>
        <h1 class="lb-h1">축제의 모든 것,<br /><em>한 곳에서</em></h1>
        <p class="lb-p">한정판 굿즈부터 현장 푸드트럭까지<br />앱 하나로 주문하고 QR로 수령하세요</p>
        <div class="lb-feats">
          <div class="lb-feat">
            <div class="lb-feat-ico">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M9 2l2 4.5H16l-3.8 2.8 1.5 4.5L9 11.1 5.3 13.8l1.5-4.5L3 6.5h4.8L9 2z" stroke="#FF2D55"
                  stroke-width="1.4" stroke-linejoin="round" />
              </svg>
            </div>
            한정판 공식 굿즈 선판매
          </div>
          <div class="lb-feat">
            <div class="lb-feat-ico">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="7" stroke="#FF2D55" stroke-width="1.4" />
                <path d="M9 5.5V9l2.5 2.5" stroke="#FF2D55" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </div>
            실시간 대기 현황 확인
          </div>
          <div class="lb-feat">
            <div class="lb-feat-ico">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect x="3" y="3" width="12" height="12" rx="2" stroke="#FF2D55" stroke-width="1.4" />
                <rect x="6" y="6" width="6" height="6" rx="1" fill="#FF2D55" />
              </svg>
            </div>
            QR로 즉시 수령
          </div>
        </div>
      </div>
    </aside>

    <!-- 폼 패널 -->
    <main class="login-form-panel">
      <div class="login-form-inner">

        <div class="mob-logo">
          <div class="mob-logo-mark">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path d="M4 5h14M4 11h10M4 17h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
              <circle cx="18" cy="17" r="3" fill="#FF2D55" />
            </svg>
          </div>
          <span class="mob-logo-name">FESTIO SHOP</span>
        </div>

        <div class="auth-tabs" role="tablist">
          <button class="auth-tab on" id="tabL" role="tab" aria-selected="true" aria-controls="paneL">로그인</button>
          <button class="auth-tab" id="tabR" role="tab" aria-selected="false" aria-controls="paneR">회원가입</button>
        </div>

        <!-- 로그인 -->
        <section class="auth-pane on" id="paneL" role="tabpanel">
          <div class="fgrp"><label class="flabel" for="lEmail">이메일</label>
            <input class="finput" type="email" id="lEmail" placeholder="이메일" autocomplete="email" />
          </div>
          <div class="fgrp"><label class="flabel" for="lPw">비밀번호</label>
            <input class="finput" type="password" id="lPw" placeholder="비밀번호" autocomplete="current-password" />
          </div>
          <div class="form-opts">
            <label class="chk-wrap"><input type="checkbox" id="remember" /><span class="chk-box"></span><span>로그인
                유지</span></label>
            <a href="#" class="link-sm">비밀번호 찾기</a>
          </div>
          <div class="ferr" id="lErr" role="alert"></div>
          <button class="btn-blk" id="btnLSubmit">로그인</button>
          <div class="divider-txt"><span>또는 간편 로그인</span></div>
          <div class="social-btns">
            <button class="btn-social btn-kakao" id="btnKakao">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M10 3C6.13 3 3 5.68 3 8.97c0 2.1 1.3 3.95 3.28 5.09L5.5 17l3.36-2.22c.37.06.75.09 1.14.09 3.87 0 7-2.68 7-5.97S13.87 3 10 3z"
                  fill="#3A1D1D" />
              </svg>
              카카오로 계속하기
            </button>
            <button class="btn-social btn-naver" id="btnNaver">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <rect width="20" height="20" rx="4" fill="#03C75A" />
                <path d="M6 5h3l2.5 4.5V5H15v10h-3L9.5 10.5V15H6V5z" fill="white" />
              </svg>
              네이버로 계속하기
            </button>
            <button class="btn-social btn-google" id="btnGoogle"
              style="background:#fff; color:#333; border:1px solid #ddd;">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4c-.2 1.2-.9 2.3-1.9 3l3 2.3c1.8-1.7 2.8-4.2 2.8-7.1z"
                  fill="#4285F4" />
                <path
                  d="M10 20c2.7 0 5-.9 6.7-2.4l-3-2.3c-.9.6-2 .9-3.7.9-2.8 0-5.2-1.9-6-4.5H.8v2.4C2.5 17.6 6 20 10 20z"
                  fill="#34A853" />
                <path d="M4 11.7c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8V5.7H.8C.3 6.9 0 8.4 0 9.9s.3 3 .8 4.2l3.2-2.4z"
                  fill="#FBBC05" />
                <path
                  d="M10 3.8c1.5 0 2.8.5 3.9 1.5l2.9-2.9C15 1 12.7 0 10 0 6 0 2.5 2.4.8 5.7l3.2 2.4c.8-2.6 3.2-4.3 6-4.3z"
                  fill="#EA4335" />
              </svg>
              구글로 계속하기
            </button>
            <button class="btn-social btn-toss" id="btnToss" style="background:#0064FF; color:#fff;">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M6 10l3 3 5-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              토스로 계속하기
            </button>
          </div>
        </section>

        <!-- 회원가입 -->
        <section class="auth-pane" id="paneR" role="tabpanel" hidden>
          <div class="fgrp"><label class="flabel" for="rName">이름</label>
            <input class="finput" type="text" id="rName" placeholder="이름" autocomplete="name" />
          </div>
          <div class="fgrp"><label class="flabel" for="rEmail">이메일</label>
            <input class="finput" type="email" id="rEmail" placeholder="이메일" autocomplete="email" />
          </div>
          <div class="fgrp"><label class="flabel" for="rPhone">휴대폰</label>
            <input class="finput" type="tel" id="rPhone" placeholder="010-0000-0000" autocomplete="tel" />
          </div>
          <div class="fgrp"><label class="flabel" for="rPw">비밀번호</label>
            <input class="finput" type="password" id="rPw" placeholder="8자 이상" autocomplete="new-password" />
          </div>
          <div class="fgrp"><label class="flabel" for="rPwC">비밀번호 확인</label>
            <input class="finput" type="password" id="rPwC" placeholder="비밀번호 재입력" autocomplete="new-password" />
          </div>
          <div class="terms-box">
            <label class="chk-wrap"><input type="checkbox" id="agreeAll" /><span class="chk-box"></span><span
                class="terms-all">전체 동의</span></label>
            <div class="terms-items">
              <label class="chk-wrap"><input type="checkbox" class="tc" id="agSvc" /><span
                  class="chk-box"></span><span>[필수] 서비스 이용약관</span></label>
              <label class="chk-wrap"><input type="checkbox" class="tc" id="agPrv" /><span
                  class="chk-box"></span><span>[필수] 개인정보 처리방침</span></label>
              <label class="chk-wrap"><input type="checkbox" class="tc" id="agMkt" /><span
                  class="chk-box"></span><span>[선택] 마케팅 정보 수신</span></label>
            </div>
          </div>
          <div class="ferr" id="rErr" role="alert"></div>
          <button class="btn-blk" id="btnRSubmit">회원가입</button>
        </section>

      </div>
    </main>

  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
