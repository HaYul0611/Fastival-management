<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스태프 스캔 | FESTIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <!-- custom.css 복구 -->
  <link rel="stylesheet" href="/assets/css/custom.css?v=2506">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="/assets/css/staff-scan.css" />
  <script type="module">
    import { injectLayout } from '/assets/js/layout.js?v=2506';
    injectLayout();
  </script>
</head>

<body>

  <div id="app-shell">

    <!-- 좌측 사이드바 영역 -->


    <!-- 메인 작업 영역 -->
    <main id="main-container">


      <div id="main-content">
        <section id="view-scanner" class="content-view active">
          <div class="scanner-layout" style="display: flex; gap: 20px; padding: 20px; flex-wrap: wrap;">
            <div class="camera-section" style="flex: 1; min-width: 300px; max-width: 600px;">
              <div
                style="position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                <div id="ssCameraReader"
                  style="width: 100%; min-height: 300px; display: block; border-radius: 8px; overflow: hidden; background: #000;">
                </div>

                <!-- 카메라 대기 상태 아이콘 (SVG) -->
                <div id="ssCameraPlaceholder"
                  style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.85); z-index: 10;">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                  </svg>
                  <span style="color: #94a3b8; margin-top: 12px; font-size: 14px; font-weight: 500;">카메라 대기 중...</span>
                </div>

                <!-- 스캔 결과 인라인 오버레이 (비활성화 상태) -->
                <div id="ssResultCard" hidden class="ss-result-card"></div>
              </div>
              <div
                style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; margin-top: 12px; gap: 15px; flex-wrap: wrap;">
                <div id="ssCameraError"
                  style="color: #ef4444; flex: 1; min-width: 200px; font-size: 14px; word-break: keep-all; margin: 5px 0;"
                  hidden>
                </div>
                <button id="ssRetryBtn" class="btn btn-rigid"
                  style="display: none; padding: 8px 16px; flex-shrink: 0; margin-left: auto;">스캔리셋</button>
              </div>

              <div id="ssManualPanel" style="margin-top: 15px; display: flex; gap: 10px;">
                <input type="text" id="ssManualInput" placeholder="바코드 번호 직접 입력" class="input-rigid" style="flex: 1;" />
                <button id="ssManualSubmit" class="btn btn-rigid btn-green">입력</button>
              </div>

              <div id="ssResultCard" style="margin-top: 20px;"></div>
              <button id="ssExceptionBtnInCard" class="btn btn-rigid btn-red"
                style="display:none; margin-top: 10px; width: 100%;">예외 처리 진행</button>
            </div>

            <div class="admin-section" style="flex: 1; min-width: 300px;">
              <div class="user-info"
                style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <span id="ssRoleBadge"
                  style="background: #38bdf8; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px;"></span>
                <span id="ssRoleLabel" style="color: #cbd5e1; margin-left: 10px;"></span>
                <span id="ssUserName" style="color: #fff; font-weight: bold; margin-left: 10px;"></span>
              </div>

              <!-- 권한 해제 패널 -->
              <div id="ssAdminPanel" class="panel-rigid" style="margin-bottom: 20px;" hidden>
                <div class="panel-header-rigid" style="justify-content: center; font-size: 16px;">티켓 스캔 리셋</div>
                <div class="panel-body-rigid" style="padding: 20px;">
                  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="ssUnlockInput" placeholder="티켓 번호 입력" class="input-rigid"
                      style="flex: 1; min-width: 200px;" />
                    <button id="ssUnlockBtn" class="btn btn-rigid btn-blue"
                      style="flex-shrink: 0; padding: 8px 16px;">해제</button>
                  </div>
                  <div id="ssUnlockResult" style="margin-top: 10px; color: #10b981;"></div>
                </div>
              </div>

              <div class="panel-rigid" style="margin-bottom: 20px;">
                <div class="panel-header-rigid"
                  style="display: flex !important; flex-direction: row !important; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
                  <div
                    style="display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; flex: 1; min-width: 0; width: auto !important; flex-wrap: wrap;">
                    <span style="font-size: 14px; white-space: nowrap; font-weight: bold;">스캔 기록</span>
                    <div class="mock-simulator-dots"
                      style="font-size: 11px; color: var(--text-muted); display: flex !important; flex-direction: row !important; align-items: center; gap: 5px; white-space: nowrap; width: auto !important; padding: 5px;">
                      <span style="white-space: nowrap;">모의 테스트 스캔:</span>
                      <span class="mock-dot dot-green btn-mock-scan" data-id="T00000001001"
                        data-tooltip="[정상 티켓]"></span>
                      <span class="mock-dot dot-purple btn-mock-scan" data-id="G00000001005"
                        data-tooltip="[중복 티켓]"></span>
                      <span class="mock-dot dot-red btn-mock-scan" data-id="F0000000000X" data-tooltip="[오류 티켓]"></span>
                    </div>
                  </div>
                  <div
                    style="display: flex !important; flex-direction: row !important; align-items: center; font-size: 12px; font-weight: bold; padding: 4px 8px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; white-space: nowrap; width: auto !important; flex-shrink: 0;">
                    <span id="ssLogCount">0</span>건
                  </div>
                </div>
                <div class="panel-body-rigid" style="padding: 0;">
                  <div style="padding: 15px; border-bottom: 1px solid var(--border-color);">
                    <input type="text" id="ssLogSearchInput" class="input-rigid" placeholder="검색할 티켓 번호를 입력하세요..."
                      style="width: 100%; max-width: 400px; padding: 10px;">
                  </div>
                  <div style="max-height: 350px; overflow-y: auto; overflow-x: auto;">
                    <table class="table-rigid" style="min-width: 800px;">
                      <thead>
                        <tr>
                          <th>스캔 시간</th>
                          <th>티켓 번호</th>
                          <th>매핑 좌석</th>
                          <th>고객명</th>
                          <th>티켓 유형</th>
                          <th>수량</th>
                          <th>검증 상세 상태</th>
                          <th class="text-right">결과 지표</th>
                        </tr>
                      </thead>
                      <tbody id="ssLogList">
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <!-- 모달 팝업 영역 -->
            <!-- 화면 중앙 실시간 검증 결과 오버레이 팝업 -->
            <div id="scan-validation-screen" class="scan-validation-popup" style="display:none;">
              <h1 id="scan-result-title" style="margin: 0 0 10px 0; font-size: 32px; font-weight: 900;"></h1>
              <h2 id="scan-result-ticket-number"
                style="margin: 0 0 15px 0; font-size: 24px; font-weight: 600; color: #475569;"></h2>
              <div id="scan-result-msg"
                style="font-size: 22px; font-weight: bold; margin-bottom: 24px; color: #334155;"></div>

              <button type="button" id="ssExceptionBtnInToast" class="btn btn-rigid"
                style="display: none; width: 100%; padding: 20px; font-size: 24px; font-weight: bold; margin-bottom: 15px; background: #64748b; color: #fff;">
                스태프 예외 승인
              </button>

              <button type="button" id="btn-close-scan-overlay" class="btn btn-rigid btn-green"
                style="width: 100%; padding: 20px; font-size: 24px; font-weight: bold;">
                확인
              </button>
            </div>

            <div id="ssWristbandModal" hidden
              style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;">
              <div id="ssWristbandBackdrop" class="modal-backdrop"
                style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.5);"></div>
              <div class="modal-content"
                style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 20px; border-radius: 8px; z-index: 1001; min-width: 300px;">
                <div id="ssWristbandBody" style="color: #fff; margin-bottom: 20px;"></div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                  <button id="ssWristbandIssueBtn" class="btn btn-rigid btn-green">팔찌 발급</button>
                  <button id="ssWristbandCloseBtn" class="btn btn-rigid">닫기</button>
                </div>
              </div>
            </div>

            <div id="ssExceptionModal" hidden
              style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;">
              <div id="ssExceptionBackdrop" class="modal-backdrop"
                style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.5);"></div>
              <div class="modal-content"
                style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 20px; border-radius: 8px; z-index: 1001; min-width: 300px;">
                <div id="ssExceptionBody" style="color: #fff; margin-bottom: 20px;"></div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                  <button id="ssExceptionApproveBtn" class="btn btn-rigid btn-green">예외 승인</button>
                  <button id="ssExceptionCancelBtn" class="btn btn-rigid">취소</button>
                </div>
              </div>
            </div>
        </section>
      </div>
    </main>

  </div>

  <script type="module" src="/js/staff-scan.js?v=2506"></script>
  <script type="module">
    import { initUI } from '/assets/js/ui.js?v=2506';
    document.addEventListener('DOMContentLoaded', () => {
      initUI();
    });
  </script>
</body>

</html>
