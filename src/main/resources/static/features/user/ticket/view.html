<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 티켓 | FESTIO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .ticket-container {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }

        .back-btn {
            position: absolute;
            top: 24px;
            left: 20px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .title {
            color: #8930F8;
            font-weight: 900;
            font-size: 22px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .user-name {
            font-size: 16px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            margin-right: 8px;
        }

        .badge-bronze {
            background: #F3E5AB;
            color: #8B4513;
        }

        .badge-silver {
            background: #E5E4E2;
            color: #708090;
        }

        .badge-gold {
            background: #FFFDD0;
            color: #DAA520;
        }

        .badge-emerald {
            background: #D0F0C0;
            color: #50C878;
        }

        .badge-diamond {
            background: #F0FFFF;
            color: #B9F2FF;
        }

        .badge-vip {
            background: #F3EDFF;
            color: #8930F8;
        }

        .badge-svip {
            background: #E0B0FF;
            color: #6A0DAD;
        }

        .badge-vvip {
            background: #301934;
            color: #FFD700;
        }

        /* 12자리 비주얼 바코드 */
        .totp-code {
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 4px;
            color: #1e293b;
            font-weight: 800;
            margin-bottom: 20px;
        }

        /* QR 래퍼 (타임 레이어 포함) */
        .qr-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        #qr-code {
            width: 100%;
            height: 100%;
        }

        /* 스크린샷 방지 애니메이션 (비주얼 타임 레이어) */
        .qr-scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(137, 48, 248, 0.2), transparent);
            animation: scan 2.5s infinite linear;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                transform: translateY(-40px);
            }

            100% {
                transform: translateY(220px);
            }
        }

        /* 타이머 영역 */
        .timer-container {
            background: #f1f5f9;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
        }

        .timer-bar {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            height: 100%;
            width: 100%;
            transition: width 1s linear;
        }

        .timer-text {
            font-size: 14px;
            color: #64748b;
            margin-top: 12px;
            font-weight: 600;
        }

        .timer-text span {
            color: #8930F8;
            font-weight: 800;
        }

        .warning {
            font-size: 12px;
            color: #ff4757;
            margin-top: 24px;
            line-height: 1.5;
            font-weight: 600;
            background: #fff1f2;
            padding: 12px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="ticket-container">
        <button class="back-btn" onclick="history.back()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
        <div class="title" style="margin-top: 10px;">FESTIO TICKET</div>
        <div class="subtitle">입장 시 스태프에게 아래 QR코드를 보여주세요</div>

        <div class="qr-wrapper">
            <div id="qr-code"></div>
            <div class="qr-scan-line"></div>
        </div>

        <div class="user-name">
            <span id="grade-badge" class="badge badge-bronze">BRONZE</span>
            <span id="user-display">이용자</span>
        </div>
        <div class="totp-code" id="code-display">------</div>

        <div class="timer-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
        <div class="timer-text"><span id="timer-sec">03:00</span> 후 자동 갱신</div>

        <div class="warning">
            ※ 캡처된 화면은 사용할 수 없습니다.<br>
            ※ 스크린샷 방지 보안이 적용된 티켓입니다.
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const hexSecret = urlParams.get('secret') || 'TESTSECRETKEY';
        const displayCode = urlParams.get('displayCode') || 'T00000000001';
        const userName = urlParams.get('userName') || '김*율';
        const grade = urlParams.get('grade') || 'BRONZE';

        document.getElementById('user-display').innerText = userName;
        document.getElementById('code-display').innerText = displayCode;

        const badgeEl = document.getElementById('grade-badge');
        badgeEl.textContent = grade;
        badgeEl.className = `badge badge-${grade.toLowerCase()}`;

        let qrCodeInstance = null;
        const CYCLE_SEC = 180; // 3분 갱신 주기

        async function generateTotp(secret) {
            // secret 문자열을 TextEncoder로 바이트 배열 변환
            const encoder = new TextEncoder();
            const keyBytes = encoder.encode(secret);
            const cryptoKey = await crypto.subtle.importKey(
                "raw", keyBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
            );

            // 3분(180초) 단위 epoch 사용
            const epoch = Math.floor(Date.now() / (CYCLE_SEC * 1000));
            const counterBytes = new Uint8Array(8);
            let temp = epoch;
            for (let i = 7; i >= 0; i--) {
                counterBytes[i] = temp & 0xFF;
                temp = Math.floor(temp / 256);
            }

            const signature = await crypto.subtle.sign("HMAC", cryptoKey, counterBytes);
            const hash = new Uint8Array(signature);

            const offset = hash[hash.length - 1] & 0x0F;
            const binary = ((hash[offset] & 0x7F) << 24) |
                ((hash[offset + 1] & 0xFF) << 16) |
                ((hash[offset + 2] & 0xFF) << 8) |
                (hash[offset + 3] & 0xFF);

            const otp = binary % 1000000;
            return otp.toString().padStart(6, '0');
        }

        async function refreshTotp() {
            try {
                // QR 페이로드는 TOTP 코드를 포함한 문자열로 생성
                const code = await generateTotp(hexSecret);
                const payload = `TOTP:${orderId}:${code}`;

                const qrContainer = document.getElementById('qr-code');
                qrContainer.innerHTML = ''; // clear old
                qrCodeInstance = new QRCode(qrContainer, {
                    text: payload,
                    width: 196,
                    height: 196,
                    colorDark: "#1e293b",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (e) {
                console.error(e);
            }
        }

        function updateTimer() {
            const currentSeconds = Math.floor(Date.now() / 1000) % CYCLE_SEC;
            const remaining = CYCLE_SEC - currentSeconds;

            // 03:00 포맷으로 노출
            const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
            const secs = String(remaining % 60).padStart(2, '0');
            document.getElementById('timer-sec').innerText = `${mins}:${secs}`;

            const percentage = (remaining / CYCLE_SEC) * 100;
            document.getElementById('timer-bar').style.width = percentage + '%';

            // 주기마다 새 TOTP 생성
            if (remaining === CYCLE_SEC || (remaining === CYCLE_SEC - 1 && currentSeconds === 1)) {
                refreshTotp();
            }
        }

        // Init
        refreshTotp();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>

</html>
