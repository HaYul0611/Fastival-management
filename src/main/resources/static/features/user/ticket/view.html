<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 티켓 | FESTIO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/view.css" />
</head>
<body>
    <div class="ticket-container">
        <div class="title">FESTIO TICKET</div>
        <div class="subtitle">입장 시 스태프에게 보여주세요</div>
        
        <div class="totp-code" id="totp-display">------</div>
        
        <div class="qr-box" id="qr-box">
            <div id="qr-code"></div>
        </div>
        
        <div class="timer-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>
        <div class="timer-text"><span id="timer-sec">30</span>초 후 코드가 새로고침됩니다.</div>
        
        <div class="warning">
            ※ 캡처된 화면은 사용할 수 없습니다.<br>
            ※ 스크린샷 방지 보안이 적용된 티켓입니다.
        </div>
    </div>

    <script src="js/view.js"></script>
</body>
</html>
