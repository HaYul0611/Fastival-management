<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 티켓 | FESTIO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/view.css" />
</head>

<body>
    <!-- Theme Toggle Switch -->
    <div class="theme-switch-wrapper">
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" onchange="document.body.classList.toggle('dark-theme')">
            <span class="slider round">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>
        </label>
    </div>

    <div class="ticket-container">
        <button class="back-btn" onclick="history.back()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
        <div class="title" style="margin-top: 10px;">FESTIO TICKET</div>
        <div class="subtitle">입장 시 스태프에게<br>아래 QR코드를 보여주세요</div>

        <div class="qr-wrapper">
            <div id="qr-code"></div>
            <div class="qr-scan-line"></div>
        </div>

        <div class="totp-code" id="code-display" style="margin-top: 15px;">------</div>
        <div class="user-name"
            style="margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;">
            <span id="grade-badge" class="badge badge-bronze" style="margin-right: 2px;">
                <span id="grade-text">BRONZE</span>
            </span>
            <span id="user-display">이용자</span>
        </div>

        <div
            style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 180px; margin: 4px auto 0;">
            <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <div
                    style="flex: 1; height: 6px; background: #EFEFEF; border-radius: 6px; overflow: hidden; position: relative;">
                    <div id="timer-bar"
                        style="position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: linear-gradient(90deg, #00d2ff, #8930F8); transform-origin: left; transition: transform 1s linear, background 0.3s ease;">
                    </div>
                </div>
                <button id="timer-refresh-btn" onclick="refreshTotpManual();"
                    style="background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; color: #8930F8; transition: transform 0.2s; flex-shrink: 0;"
                    title="새로고침">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                    </svg>
                </button>
            </div>
            <span id="timer-sec" class="timer-sec-text"
                style="font-size: 0.9rem; font-weight: 800; display: block; text-align: center;">03:00</span>
        </div>

        <div class="warning">
            ※ 캡처된 화면은 사용할 수 없습니다.<br>
            ※ 스크린샷 방지 보안이 적용된 티켓입니다.
        </div>
    </div>

    <script src="js/view.js"></script>
</body>

</html>
