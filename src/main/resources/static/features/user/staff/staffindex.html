<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FESTIO STAFF SYSTEM | FESTIO</title>
  <link rel="stylesheet" href="/assets/css/custom.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
</head>

<body>

  <div id="app-shell">

    <!-- Sidebar -->
    <aside id="sidebar" class="collapsed">
      <div class="sidebar-header">
        <span class="sidebar-title"
          style="background: linear-gradient(90deg, #38bdf8, #10b981); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 1px;">FESTIO
          STAFF SYSTEM</span>
      </div>
      <ul class="sidebar-menu">
        <!-- Loaded dynamically from /features/user/staff/menu_aside.html -->
      </ul>
    </aside>

    <!-- Main Workspace -->
    <main id="main-container">
      <header id="header">
        <button id="toggle-sidebar-btn" class="header-menu-btn">≡</button>
        <div id="header-checkpoint">[ 로딩 중... ]</div>
        <div class="header-actions">
          <div class="bell-container">
            <span id="notif-bell"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg></span>
            <span id="notif-badge" style="display: none;">0</span>
            <div id="notif-popover" class="notif-popover-rigid">
              <div class="notif-popover-header">
                <span>실시간 알림 (텔레메트리)</span>
                <span style="color:#10b981; font-family:var(--font-mono);">SYNC OK</span>
              </div>
              <div class="notif-list-container" id="notif-list"></div>
            </div>
          </div>
          <span id="header-user">인증 대기 중</span>
          <button id="logout-btn">로그아웃</button>
        </div>
      </header>

      <div id="main-content">
        <!-- Login screen (shown when not authenticated) -->
        <section id="view-login" class="content-view active">
          <!-- Rendered by js/ui.js -->
        </section>

        <!-- Dashboard view -->
        <section id="view-dashboard" class="content-view">
          <!-- 전체 렌더링을 js/ui.js의 renderDashboard()가 담당합니다 -->
          <div style="padding: 40px; text-align: center; color: var(--text-muted);">
            <div class="animate-pulse" style="font-size: 14px;">대시보드 로딩 중...</div>
          </div>
        </section>
        <!-- Store Dashboard view (iframe 연동) -->
        <section id="view-store-dashboard" class="content-view" style="padding:0;">
          <iframe src="/features/user/staff/staff-store-dashboard.html"
            style="width: 100%; height: calc(100vh - 60px); border: none;"></iframe>
        </section>
      </div>
    </main>

  </div>

  <script type="module" src="js/staffindex.js"></script>

</body>

</html>
