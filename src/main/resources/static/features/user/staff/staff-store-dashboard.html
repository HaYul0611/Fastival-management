<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 부스 관리자 대시보드 | FESTIO</title>
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="stylesheet" href="/features/user/staff/css/staff-dashboard.css">
</head>

<body>

  <div class="dashboard-container">
    <h1>부스 관리자 대시보드</h1>

    <div class="store-select-wrap">
      <label><strong>관리할 부스 선택</strong></label>
      <select id="storeSelect">
        <option value="">부스를 선택해주세요</option>
      </select>
    </div>

    <div id="dashboardContent" class="dashboard-content-hidden">
      <div class="card">
        <h2>실시간 대기열 현황 (자동 산출 로직)</h2>
        <div class="stat-row">
          <div class="stat-box">
            <div>조리 대기 중(건)</div>
            <div class="num" id="pendingOrdersCnt">0</div>
          </div>
          <div class="stat-box">
            <div>자동 산출 대기시간</div>
            <div class="num" id="autoWaitTime">0분</div>
          </div>
        </div>
        <p class="desc-text">주문 1건당 평균 2분 소요로 자동 계산됩니다.</p>
      </div>

      <div class="card">
        <h2>수동 대기 시간 설정 (오버라이드)</h2>
        <p class="desc-text-sub">자동 산출 로직 대신, 현장 상황에 맞춰 강제로 대기 시간을 고정합니다.</p>

        <div class="mg-bottom-15">
          <label>수동 설정할 대기 시간 (분)</label>
          <input type="number" id="manualTimeInput" placeholder="예: 20">
        </div>

        <div class="toggle-wrap">
          <span><strong>수동 오버라이드 활성화</strong></span>
          <label class="switch">
            <input type="checkbox" id="manualToggle">
            <span class="slider"></span>
          </label>
        </div>

        <button class="btn mg-top-20" id="saveBtn">변경 사항 저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shop/js/supabase_client.js"></script>
  <script type="module" src="/features/user/staff/js/staff-dashboard.js?v=v2"></script>
</body>

</html>
