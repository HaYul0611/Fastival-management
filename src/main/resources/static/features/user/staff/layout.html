<!-- Layout: Header and Sidebar -->
<aside id="sidebar" class="collapsed">
    <div class="sidebar-header">
        <span class="sidebar-title"
            style="background: linear-gradient(90deg, #8b5cf6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; font-weight: 900; font-family: 'Outfit', 'Inter', sans-serif; letter-spacing: 0px; font-size: 1.1rem;">FESTIO
            STAFF SYSTEM</span>
    </div>
    <ul class="sidebar-menu">
    </ul>
</aside>

<header id="header">
    <button id="toggle-sidebar-btn" class="header-menu-btn">≡</button>
    <div id="header-checkpoint">[ 로딩 중... ]</div>
    <div class="header-actions">
        <div class="bell-container">
            <span id="notif-bell"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg></span>
            <span id="notif-badge" style="display: none;">0</span>
            <div id="notif-popover" class="notif-popover-rigid">
                <div class="notif-popover-header">
                    <span>실시간 알림 (텔레메트리)</span>
                </div>
                <div class="notif-list-container" id="notif-list"></div>
            </div>
        </div>
        <span id="header-user">인증 대기 중</span>
        <button id="logout-btn">로그아웃</button>
    </div>
</header>
