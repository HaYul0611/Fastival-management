<!doctype html>
<html lang="ko" class="layout-menu-fixed layout-compact" data-assets-path="/assets/" data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>가맹점 관리 대시보드 | FESTIO</title>

    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/vendor/fonts/iconify-icons.css" />
    <link rel="stylesheet" href="/assets/vendor/css/core.css" />
    <link rel="stylesheet" href="/assets/css/demo.css" />
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="/assets/vendor/libs/apex-charts/apex-charts.css" />
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    <link rel="stylesheet" href="./css/store-list.css" />
  </head>

  <body>
    <div class="layout-wrapper layout-content-navbar">
      <div class="layout-container">
        
        <!-- Sidebar Menu -->
        <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
          <!-- sidebar.js 가 런타임에 동적으로 삽입 -->
        </aside>

        <div class="layout-page">
          <!-- Navbar -->
          <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme" id="layout-navbar">
            <div class="layout-menu-toggle navbar-nav align-items-xl-center me-4 me-xl-0 d-xl-none">
              <a class="nav-item nav-link px-0 me-xl-6" href="javascript:void(0)">
                <i class="bx bx-menu bx-sm"></i>
              </a>
            </div>
            <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
              <h5 class="mb-0 fw-bold"><i class="bx bx-store me-2 text-primary"></i>입점 가맹점 관리 대시보드</h5>
              <ul class="navbar-nav flex-row align-items-center ms-auto">
                <li class="nav-item dropdown-user dropdown">
                  <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                    <div class="avatar avatar-online">
                      <img src="/assets/img/avatars/chibi_admin.png" class="w-px-40 h-auto rounded-circle" />
                    </div>
                  </a>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                      <a class="dropdown-item" href="#">
                        <div class="d-flex">
                          <div class="flex-shrink-0 me-3">
                            <div class="avatar avatar-online">
                              <img src="/assets/img/avatars/chibi_admin.png" class="w-px-40 h-auto rounded-circle" />
                            </div>
                          </div>
                          <div class="flex-grow-1">
                            <span class="fw-medium d-block">최고 관리자</span>
                            <small class="text-muted">Master Admin</small>
                          </div>
                        </div>
                      </a>
                    </li>
                  </ul>
                </li>
              </ul>
            </div>
          </nav>

          <!-- Content wrapper -->
          <div class="content-wrapper">
            <div class="container-xxl flex-grow-1 container-p-y">
              
              <div class="row">
                <!-- 💡 가로형 Premium Festival Card Grid (모집 대상 축제 선택) -->
                <div class="col-12 mb-6">
                  <div class="card shadow-sm border-0">
                    <div class="card-body py-4 px-4">
                      <div class="d-flex align-items-center justify-content-between mb-3">
                        <h5 class="card-title fw-bold mb-0 text-dark d-flex align-items-center">
                          <i class="bx bx-calendar-check text-primary me-2 fs-4"></i>모집 대상 축제 선택 (UPCOMING)
                        </h5>
                        <div class="d-flex align-items-center gap-2">
                          <span class="badge bg-label-primary fs-7" id="storeCountBadge">입점 업체: 0개</span>
                        </div>
                      </div>
                      
                      <!-- 가로 스크롤 컨테이너 -->
                      <div class="position-relative">
                        <div class="d-flex flex-nowrap overflow-auto gap-4 pb-2" id="festivalCardGrid" style="scroll-behavior: smooth; -webkit-overflow-scrolling: touch;">
                          <!-- JS로 동적 축제 가로 카드 렌더링 -->
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 입점 가맹점 Grid 리스트 컨테이너 -->
                <div class="col-12">
                  <div class="row" id="storeContainer">
                    <!-- JS로 동적 가맹점 카드 렌더링 -->
                  </div>
                </div>
              </div>

            </div>

            <!-- Footer -->
            <footer class="content-footer footer bg-footer-theme">
              <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                <div class="mb-2 mb-md-0">
                  © <script>document.write(new Date().getFullYear());</script> FESTIO
                </div>
              </div>
            </footer>

            <div class="content-backdrop fade"></div>
          </div>
        </div>
      </div>
      <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <!-- [상세 메뉴 조회 사이드 드로어 - Offcanvas] -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="productDrawer" aria-labelledby="productDrawerLabel" style="width: 460px;">
      <div class="offcanvas-header premium-gradient py-4">
        <h5 id="productDrawerLabel" class="text-white fw-bold mb-0">
          <i class="bx bx-list-ul me-2 fs-4"></i><span id="drawerStoreName">가맹점</span> 메뉴 목록
        </h5>
        <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body p-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>메뉴 정보</th>
                <th class="text-end">가격</th>
                <th class="text-center">상태</th>
              </tr>
            </thead>
            <tbody id="drawerProductBody">
              <!-- 동적 렌더링 -->
            </tbody>
          </table>
        </div>
        <div id="drawerEmptyMsg" class="text-center py-6 d-none">
          <div class="mb-3">
            <i class="bx bx-info-circle text-muted" style="font-size: 3rem;"></i>
          </div>
          <p class="text-secondary fw-semibold">등록된 메뉴가 없습니다.</p>
        </div>
      </div>
    </div>

    <!-- [스탭 계정 발급 확인 모달 - Modal] -->
    <div class="modal fade" id="staffCredentialsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header bg-primary py-4">
            <h5 class="modal-title text-white fw-bold"><i class="bx bx-key me-2 fs-4"></i>스탭 로그인 권한 발급 완료</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-5">
            <div class="text-center mb-4">
              <span class="badge bg-label-primary fs-6 py-2 px-3"><span id="credentialStoreName">상점명</span> 점주 계정</span>
              <p class="text-muted mt-2 small">해당 업주가 스탭 포털에 로그인하여 주문 및 재고를 관리할 수 있는 계정입니다.</p>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-bold text-secondary">📧 로그인 이메일 (아이디)</label>
              <div class="input-group">
                <input type="text" class="form-control border-primary bg-light fw-bold text-dark" id="credentialEmail" readonly />
                <button class="btn btn-outline-primary" type="button" onclick="copyText('credentialEmail')">복사</button>
              </div>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-bold text-secondary">🔒 임시 비밀번호</label>
              <div class="input-group">
                <input type="text" class="form-control border-primary bg-light fw-bold text-dark" id="credentialPassword" readonly />
                <button class="btn btn-outline-primary" type="button" onclick="copyText('credentialPassword')">복사</button>
              </div>
            </div>

            <div class="alert alert-warning border-0 d-flex align-items-center mb-0" role="alert">
              <i class="bx bx-info-circle me-2 fs-4"></i>
              <div class="small">
                위 발급된 스탭 계정(아이디와 임시비밀번호)을 복사하여 점주님께 안전하게 전달해 주시기 바랍니다.
              </div>
            </div>
          </div>
          <div class="modal-footer border-top-0 pt-0 pb-4 justify-content-center">
            <button type="button" class="btn btn-primary px-5 fw-bold" data-bs-dismiss="modal">확인 및 닫기</button>
          </div>
        </div>
      </div>
    </div>


    <!-- Scripts -->
    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/sidebar.js"></script>

    <script src="./js/store-list.js"></script>
  </body>
</html>
