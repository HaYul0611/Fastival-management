                    <h5 class="card-title m-0 fw-bold text-dark"><i class="bx bx-package me-2 text-info"></i>실시간 재고 현황 및

                  <!-- 1. Desktop & Large Tablet Landscape View (Rich Table) -->
                  <div class="table-responsive text-nowrap d-none d-md-block border-top">

                          <th class="py-3 fs-6 fw-bold text-dark text-center">품절 위기 상태</th>
                          <th class="py-3 fs-6 fw-bold text-dark text-end pe-4">판매 개시 / 수동 품절</th>

                      </thead>

                        <!-- Loaded dynamically from database -->
                      </tbody>
                    </table>
                  </div>

                  <!-- 2. Tablet Portrait & Mobile Responsive View (Intense Card Layout with Giant Touch Targets) -->
                  <div class="d-block d-md-none card-body border-top p-3 bg-light">
                    <div class="row g-3" id="mobile-inventory-list">
                      <!-- Loaded dynamically from database -->
                    </div>
                  </div>

                  <!-- 3. Goods Staff Accordion View (ROLE_GOODS_STAFF 전용) -->
                  <div id="goods-accordion-container" class="card-body border-top p-3 bg-light" style="display: none;">
