        <div class="layout-page">
          <!-- Navbar -->
          <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme" id="layout-navbar">
            <div class="layout-menu-toggle navbar-nav align-items-xl-center me-4 me-xl-0 d-xl-none">

            <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">

              <ul class="navbar-nav flex-row align-items-center ms-auto">
                <li class="nav-item dropdown-user dropdown">
                  <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                    <div class="avatar avatar-online">
                      <img src="/assets/img/avatars/chibi_admin.png" class="w-px-40 h-auto rounded-circle" />
                    </div>
                  </a>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                      <a class="dropdown-item" href="#">
                        <div class="d-flex">
                          <div class="flex-shrink-0 me-3">
                            <div class="avatar avatar-online">
                              <img src="/assets/img/avatars/chibi_admin.png" class="w-px-40 h-auto rounded-circle" />
                            </div>
                          </div>
                          <div class="flex-grow-1">
                            <span class="fw-medium d-block" id="navUserName">굿즈점주</span>

          <!-- Content wrapper -->
          <div class="content-wrapper">
            <div class="container-xxl flex-grow-1 container-p-y">
              
              <!-- 상단 카운터 정보 보드 -->
              <div class="row mb-5">
                <div class="col-12">
                  <div class="card bg-white goods-card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                      <div>
                        <h4 class="fw-bold mb-1 text-dark">실시간 MD 패키징 및 인도 관리</h4>
                        <p class="text-muted mb-0">모바일 앱으로 접수된 굿즈 예약 주문 내역을 실시간으로 확인하고 픽업을 준비하세요.</p>
                      </div>
                      <div class="d-flex gap-2">
                        <span class="badge bg-label-primary py-2 px-3 fs-6">신규 주문 대기: <strong id="newCount">0</strong>건</span>
                        <span class="badge bg-label-info py-2 px-3 fs-6">상품 준비 중: <strong id="prepCount">0</strong>건</span>
                        <span class="badge bg-label-success py-2 px-3 fs-6">포장 완료 / 수령 대기: <strong id="readyCount">0</strong>건</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 주문 3단계 보드 -->
              <div class="row g-4">
                <!-- 1. 신규 주문 -->
                <div class="col-lg-4 col-md-12">
                  <div class="order-board-col">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <h5 class="fw-bold text-dark m-0"><i class="bx bx-bell text-primary me-2 fs-4"></i>1. 신규 주문</h5>
                      <span class="badge bg-primary text-white" id="badgeNew">0</span>
                    </div>
                    <div id="newOrdersCol" class="order-cards-list">
                      <!-- 동적 렌더링 -->
                    </div>
                  </div>
                </div>

                <!-- 2. 상품 준비 중 -->
                <div class="col-lg-4 col-md-12">
                  <div class="order-board-col" style="background-color: #f0f8ff; border-color: #bcd9ff;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <h5 class="fw-bold text-dark m-0"><i class="bx bx-loader-circle text-info me-2 fs-4"></i>2. 상품 준비 중</h5>
                      <span class="badge bg-info text-white" id="badgePrep">0</span>
                    </div>
                    <div id="prepOrdersCol" class="order-cards-list">
                      <!-- 동적 렌더링 -->
                    </div>
                  </div>
                </div>

                <!-- 3. 포장 완료 / 수령 대기 -->
                <div class="col-lg-4 col-md-12">
                  <div class="order-board-col" style="background-color: #f1fcf6; border-color: #bbf0d2;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <h5 class="fw-bold text-dark m-0"><i class="bx bx-check-double text-success me-2 fs-4"></i>3. 포장 완료 / 수령 대기</h5>
                      <span class="badge bg-success text-white" id="badgeReady">0</span>
                    </div>
                    <div id="readyOrdersCol" class="order-cards-list">
                      <!-- 동적 렌더링 -->
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- Footer -->
            <footer class="content-footer footer bg-footer-theme">
