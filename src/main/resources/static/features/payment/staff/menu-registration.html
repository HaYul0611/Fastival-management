<!doctype html>
<html lang="ko" class="layout-menu-fixed layout-compact" data-assets-path="/assets/"
  data-template="vertical-menu-template-free">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>메뉴 및 옵션 마스터 등록 | FESTIO</title>

  <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/vendor/fonts/iconify-icons.css" />
  <link rel="stylesheet" href="/assets/vendor/css/core.css" />
  <link rel="stylesheet" href="/assets/css/demo.css" />
  <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
  <link rel="stylesheet" href="/assets/vendor/libs/apex-charts/apex-charts.css" />
  <script src="/assets/vendor/js/helpers.js"></script>
  <script src="/assets/js/config.js"></script>
  <link rel="stylesheet" href="./css/menu-registration.css" />
</head>

<body>
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

      <!-- Sidebar Menu -->
      <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
        <!-- sidebar.js 가 런타임에 동적으로 삽입 -->
      </aside>

      <div class="layout-page">
        <!-- Navbar -->
        <nav
          class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
          id="layout-navbar">
          <div class="layout-menu-toggle navbar-nav align-items-xl-center me-4 me-xl-0 d-xl-none">
            <a class="nav-item nav-link px-0 me-xl-6" href="javascript:void(0)">
              <i class="bx bx-menu bx-sm"></i>
            </a>
          </div>
          <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
            <h5 class="mb-0 fw-bold"><i class="bx bx-list-plus me-2 text-primary"></i>메뉴 및 옵션 마스터 등록</h5>
            <ul class="navbar-nav flex-row align-items-center ms-auto">
              <li class="nav-item dropdown-user dropdown">
                <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                  <div class="avatar avatar-online">
                    <img src="/assets/img/avatars/chibi_admin.png" class="w-px-40 h-auto rounded-circle" />
                  </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <a class="dropdown-item" href="#">
                      <div class="d-flex">
                        <div class="flex-shrink-0 me-3">
                          <div class="avatar avatar-online">
                            <img src="/assets/img/avatars/chibi_admin.png" class="w-px-40 h-auto rounded-circle" />
                          </div>
                        </div>
                        <div class="flex-grow-1">
                          <span class="fw-medium d-block">최고 관리자</span>
                          <small class="text-muted">Master Admin</small>
                        </div>
                      </div>
                    </a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </nav>

        <!-- Content wrapper -->
        <div class="content-wrapper">
          <div class="container-xxl flex-grow-1 container-p-y">

            <div class="row">
              <div class="col-xl-7 col-lg-12 mb-6">
                <div class="card h-100 shadow-sm">
                  <div class="card-header pb-2">
                    <h5 class="card-title m-0 fw-bold text-dark"><i class="bx bx-list-plus me-2 text-info"></i>상품 및 메뉴
                      등록 마스터 폼</h5>
                  </div>
                  <div class="card-body">
                    <form>
                      <div class="mb-4">
                        <label class="form-label fw-bold text-dark fs-6">상품명</label>
                        <input type="text" id="menuNameInput" class="form-control form-control-lg py-3"
                          placeholder="예: 원조 매운 떡볶이" style="font-size: 1rem;" />
                      </div>

                      <!-- 배민 스타일 메뉴 이미지 실시간 추천 & 수동 업로드 통합 섹션 -->
                      <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                          <label class="form-label fw-bold text-dark fs-6 mb-0">메뉴 이미지 설정</label>
                          <span class="text-muted fs-8">직접 올리거나 아래 추천 이미지를 콕 눌러보세요!</span>
                        </div>

                        <!-- 이미지 미리보기 & 수동 파일 업로드 컨트롤 -->
                        <div class="d-flex align-items-center gap-3 p-3 border rounded-3 bg-white mb-3">
                          <div class="position-relative" style="width: 80px; height: 80px; min-width: 80px;">
                            <img id="menuImagePreview"
                              src="https://images.unsplash.com/photo-1489641493513-ba4ee84ccea9?auto=format&fit=crop&w=150&h=150&q=80"
                              class="w-100 h-100 rounded-3 object-fit-cover border" />
                            <button type="button" id="clearImageBtn"
                              class="btn btn-sm btn-icon btn-danger position-absolute top-0 end-0 p-0 rounded-circle"
                              style="width: 22px; height: 22px; transform: translate(30%, -30%); display: none;">
                              <i class="bx bx-x fs-6"></i>
                            </button>
                          </div>
                          <div class="flex-grow-1">
                            <input type="file" id="manualFileInput" class="form-control form-control-sm"
                              accept="image/*" />
                            <small class="text-muted mt-1 d-block fs-8">JPG, PNG 파일 지원 (최대 5MB)</small>
                          </div>
                        </div>

                        <!-- 추천 이미지 목록 영역 (가로 스크롤 지원) -->
                        <div id="recommended-section" class="p-3 border border-dashed rounded-3 bg-light"
                          style="display: none; transition: all 0.3s ease;">
                          <div class="fw-bold text-info fs-7 mb-2"><i class="bx bx-wand-magic-1 me-1"></i>메뉴명에 맞춘 추천
                            이미지:</div>
                          <div class="d-flex gap-2 overflow-x-auto pb-1" id="recommendedThumbnails"
                            style="scrollbar-width: thin; -webkit-overflow-scrolling: touch;">
                            <!-- 동적 썸네일 노출 -->
                          </div>
                        </div>

                        <!-- 최종 DB 저장용 숨겨진 이미지 URL 인풋 -->
                        <input type="hidden" id="menuImageUrlInput" value="" />
                      </div>
                      <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                          <label class="form-label fw-bold text-dark fs-6">기본 판매 가격</label>
                          <input type="number" id="menuPriceInput" class="form-control form-control-lg py-3"
                            placeholder="0" style="font-size: 1rem;" />
                        </div>
                        <div class="col-md-6">
                          <label class="form-label fw-bold text-dark fs-6">상품 소속 카테고리</label>
                          <select id="menuCategorySelect" class="form-select form-select-lg py-3"
                            style="font-size: 1rem;">
                            <option value="FOOD">푸드 메뉴 (Food)</option>
                            <option value="SIDE">사이드 메뉴 (Side)</option>
                            <option value="BEVERAGE">드링크 / 주류 (Beverage)</option>
                          </select>
                        </div>
                      </div>

                      <hr class="my-4" />

                      <!-- 굿즈 사장님을 위한 옵션 조합 생성기 (ROLE_GOODS_STAFF 전용) -->
                      <div id="goodsOptionGeneratorContainer" class="border border-2 rounded-3 p-4 mb-4" style="display: none; background-color: #f0f2ff; border-color: #a2a4ff !important;">
                        <h6 class="fw-bold text-primary mb-3"><i class="bx bx-wand-magic-1 me-1"></i>굿즈 옵션 자동 조합 생성기</h6>
                        <div class="row g-2 mb-3">
                          <div class="col-md-5 col-12">
                            <label class="form-label fw-bold text-dark fs-7">옵션명</label>
                            <input type="text" id="optGenName" class="form-control form-control-md" placeholder="예: 사이즈, 색상" />
                          </div>
                          <div class="col-md-7 col-12">
                            <label class="form-label fw-bold text-dark fs-7">옵션값 (쉼표로 구분)</label>
                            <input type="text" id="optGenValues" class="form-control form-control-md" placeholder="예: S, M, L 또는 Red, Blue" />
                          </div>
                        </div>
                        <button type="button" id="generateOptBtn" class="btn btn-primary btn-sm fw-bold w-100 py-2">
                          <i class="bx bx-grid-alt me-1"></i>옵션 조합 생성
                        </button>
                      </div>

                      <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="m-0 fw-bold text-dark"><i class="bx bx-cog me-1 text-info"></i>선택 옵션 그룹 설정</h6>
                        <button type="button" id="addOptionGroupBtn"
                          class="btn btn-md btn-outline-info py-2 px-3 fw-bold"><i class="bx bx-plus-circle me-1"></i>옵션
                          그룹 추가</button>
                      </div>

                      <div id="optionGroupsContainer">
                        <!-- 옵션 그룹은 '옵션 그룹 추가' 버튼으로 동적 추가 합니다 -->
                      </div>

                      <button type="button" id="registerMenuBtn"
                        class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow-sm"
                        style="min-height: 52px; font-size: 1.1rem;">
                        <i class="bx bx-check-circle me-2 fs-5"></i>메뉴 등록
                      </button>
                    </form>
                  </div>
                </div>
              </div>

              <div class="col-xl-5 col-lg-12 mb-6">
                <div class="card h-100 shadow-sm border-0">
                  <div class="card-header pb-2 bg-white">
                    <h5 class="card-title m-0 fw-bold text-dark"><i class="bx bx-store me-2 text-info fs-4"></i>등록된 메뉴
                      목록 및 필터</h5>
                  </div>

                  <!-- Category Filter Tabs -->
                  <div class="px-4 py-2 border-bottom bg-light">
                    <ul class="nav nav-pills card-header-pills gap-2" id="menuFilterTabs">
                      <li class="nav-item">
                        <button class="nav-link active fw-bold py-2 px-3" data-filter="all">전체</button>
                      </li>
                      <li class="nav-item">
                        <button class="nav-link fw-bold py-2 px-3" data-filter="food">메인 (Food)</button>
                      </li>
                      <li class="nav-item">
                        <button class="nav-link fw-bold py-2 px-3" data-filter="side">사이드 (Side)</button>
                      </li>
                      <li class="nav-item">
                        <button class="nav-link fw-bold py-2 px-3" data-filter="beverage">음료 (Beverage)</button>
                      </li>
                    </ul>
                  </div>

                  <div class="list-group list-group-flush border-top" id="menuItemContainer">
                    <!-- Item 1 -->
                    <div
                      class="list-group-item d-flex justify-content-between align-items-center py-4 px-3 hover-bg-light transition-all menu-list-item"
                      data-category="food">
                      <div class="d-flex align-items-center">
                        <!-- Star Toggle (Baemin representative menu feature) -->
                        <div class="me-3 cursor-pointer" onclick="toggleRepresentative(this, '원조 매운 떡볶이')">
                          <i class="bx bxs-star text-warning fs-3 star-icon" style="cursor: pointer;"></i>
                        </div>
                        <div class="avatar avatar-md me-3" style="width: 52px; height: 52px;">
                          <img
                            src="https://images.unsplash.com/photo-1585647347483-22b66260dfff?q=80&w=150&auto=format&fit=crop"
                            class="rounded-3 w-100 h-100 object-fit-cover" />
                        </div>
                        <div>
                          <h6 class="mb-1 fw-bold text-dark fs-6">원조 매운 떡볶이 <span
                              class="badge bg-label-warning py-1 px-2 fs-8 ms-1">대표메뉴</span></h6>
                          <small class="text-muted">₩ 6,500 / 카테고리: 메인</small>
                        </div>
                      </div>
                      <button class="btn btn-md btn-outline-secondary py-2 px-3 fw-bold"
                        style="min-width: 64px;">관리</button>
                    </div>

                    <!-- Item 2 -->
                    <div
                      class="list-group-item d-flex justify-content-between align-items-center py-4 px-3 hover-bg-light transition-all menu-list-item"
                      data-category="side">
                      <div class="d-flex align-items-center">
                        <!-- Star Toggle -->
                        <div class="me-3 cursor-pointer" onclick="toggleRepresentative(this, '수제 모둠 튀김')">
                          <i class="bx bx-star text-muted fs-3 star-icon" style="cursor: pointer;"></i>
                        </div>
                        <div class="avatar avatar-md me-3" style="width: 52px; height: 52px;">
                          <img
                            src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=150&auto=format&fit=crop"
                            class="rounded-3 w-100 h-100 object-fit-cover" />
                        </div>
                        <div>
                          <h6 class="mb-1 fw-bold text-dark fs-6">수제 모둠 튀김 (5pcs)</h6>
                          <small class="text-muted">₩ 7,000 / 카테고리: 사이드</small>
                        </div>
                      </div>
                      <button class="btn btn-md btn-outline-secondary py-2 px-3 fw-bold"
                        style="min-width: 64px;">관리</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- Footer -->
          <footer class="content-footer footer bg-footer-theme">
            <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
              <div class="mb-2 mb-md-0">
                ©
                <script>document.write(new Date().getFullYear());</script> FESTIO
              </div>
            </div>
          </footer>

          <div class="content-backdrop fade"></div>
        </div>
      </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
  </div>

  <!-- Scripts -->
  <script src="/assets/vendor/libs/jquery/jquery.js"></script>
  <script src="/assets/vendor/libs/popper/popper.js"></script>
  <script src="/assets/vendor/js/bootstrap.js"></script>
  <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
  <script src="/assets/vendor/js/menu.js"></script>
  <script src="/assets/vendor/libs/apex-charts/apexcharts.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/staff-sidebar.js"></script>

  <script src="./js/menu-registration.js"></script>
</body>

</html>
