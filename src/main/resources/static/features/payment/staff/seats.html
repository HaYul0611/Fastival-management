<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스태프 통합 관제 시스템 | FESTIO</title>
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="stylesheet" href="/assets/react-seats/index-Cnb8Xr7z.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
  <style>
    /* React 좌석 배치도의 min-height-screen과 flex-center 강제 해제 및 상단 정렬 */
    #root > div {
      min-height: auto !important;
      justify-content: flex-start !important;
      padding-top: 10px !important;
      padding-bottom: 30px !important;
      background: transparent !important;
    }
    /* SVG 컨테이너의 고정 최소 높이 완화 및 비율 최적화 */
    #root svg {
      min-height: auto !important;
      max-height: 65vh !important;
      width: 100% !important;
      height: auto !important;
    }
    /* 스크롤바 최적화 */
    #root {
      overflow-y: auto !important;
    }
  </style>
</head>

<body>

  <div id="app-shell">

    <!-- Sidebar -->
    <aside id="sidebar" class="collapsed">
      <div class="sidebar-header">
        <span class="sidebar-title"
          style="background: linear-gradient(90deg, #38bdf8, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 1px;">FESTIO
          STAFF SYSTEM</span>
      </div>
      <ul class="sidebar-menu">
        <!-- Loaded dynamically from /features/user/staff/menu_aside.html -->
      </ul>
    </aside>

    <!-- Main Workspace -->
    <main id="main-container">
      <header id="header">
        <button id="toggle-sidebar-btn" class="header-menu-btn">≡</button>
        <div id="header-checkpoint">[ 로딩 중... ]</div>
        <div class="header-actions">
          <div class="bell-container">
            <span id="notif-bell">🔔</span>
            <span id="notif-badge" style="display: none;">0</span>
            <div id="notif-popover" class="notif-popover-rigid">
              <div class="notif-popover-header">
                <span>실시간 알림 (텔레메트리)</span>
                <span style="color:#10b981; font-family:var(--font-mono);">SYNC OK</span>
              </div>
              <div class="notif-list-container" id="notif-list"></div>
            </div>
          </div>
          <span id="header-user">인증 대기 중</span>
          <button id="logout-btn">로그아웃</button>
        </div>
      </header>

      <div id="main-content" style="display: flex; flex-direction: column; height: 100%;">
        <section id="view-seats" class="content-view active" style="display: none !important;">
          <!-- Rendered by js/ui.js -->
        </section>
        <div id="root" style="flex: 1; padding: 20px; box-sizing: border-box; overflow-y: auto;"></div>
      </div>
    </main>

  </div>

  <!-- 결제 진행 모달 레이어 -->
  <div id="ticket-pay-modal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.75); align-items:center; justify-content:center; padding: 20px;">
    <div class="panel-rigid" style="width: 100%; max-width: 700px; display: flex; flex-direction: column; overflow: hidden; background: #1a202c; border: 1px solid #2d3748; border-radius: 8px;">
      <div class="panel-header-rigid" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <span style="font-weight:bold; font-size:16px;">🎟️ 현장 일괄 예매 및 결제 진행</span>
        <button id="btn-close-pay-modal" style="background: none; border: none; color: #ef4444; font-size: 24px; font-weight: bold; cursor: pointer; padding:0; line-height:1;">&times;</button>
      </div>
      <div class="panel-body-rigid" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px;">
        <form id="modal-ticketing-form" style="display: flex; flex-direction: column; gap: 20px; margin: 0;">
          <!-- 진행 행사 선택 -->
          <div class="form-group-rigid">
            <label style="font-weight: bold; color: #a0aec0; margin-bottom: 8px; display: block; font-size: 14px;">진행 행사 (Festival) 선택</label>
            <select id="modal-ticketing-festival-select" class="input-rigid" style="width: 100%; padding: 10px; font-size: 15px;">
              <!-- 동적 행사 바인딩 -->
            </select>
          </div>
          
          <!-- 좌석 목록 -->
          <div class="form-group-rigid">
            <label style="font-weight: bold; color: #a0aec0; margin-bottom: 8px; display: block; font-size: 14px;">선택된 좌석 목록 및 이용 고객 지정</label>
            <div style="max-height: 200px; overflow-y: auto; border: 1px solid #2d3748; background: #0f172a; border-radius: 6px;">
              <table class="table-rigid" style="width: 100%; font-size: 14px; margin: 0;">
                <thead>
                  <tr>
                    <th style="padding: 10px;">좌석</th>
                    <th style="padding: 10px;">요금 선택</th>
                    <th style="padding: 10px;">이용 고객</th>
                    <th style="padding: 10px;" class="text-right">금액</th>
                    <th style="padding: 10px; width: 30px;"></th>
                  </tr>
                </thead>
                <tbody id="modal-selected-seats-tbody">
                  <!-- 동적 선택 좌석 목록 -->
                </tbody>
              </table>
            </div>
          </div>
          
          <!-- 최종 결제 금액 -->
          <div style="background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; margin-top: 10px;">
            <span style="color: #fff; font-weight: bold; font-size: 15px;">최종 합산 결제 금액</span>
            <strong id="modal-ticket-final-price-lbl" style="color: #10b981; font-size: 26px; font-family: var(--font-mono);">0원</strong>
          </div>
          
          <!-- 결제 버튼 -->
          <button type="button" id="modal-btn-request-ticket-pay" class="btn btn-rigid btn-green" style="padding: 15px; font-size: 18px; font-weight: bold; margin-top: 10px;">
            결제하기
          </button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/seats.js"></script>
  <script type="module" crossorigin src="/assets/react-seats/index-BSHGu9ZY.js"></script>

</body>

</html>
