                <div class="card h-100">
                  <div class="card-header">
                    <h5 class="card-title m-0 fw-semibold">1:1 관리자 문의 접수 폼</h5>
                  </div>
                  <div class="card-body">
                    <form>
                      <div class="mb-3">
                        <label class="form-label">문의 카테고리</label>
                        <div class="custom-category-dropdown" id="inqCategoryDropdown">
                          <div class="custom-category-selected" id="inqCategorySelected">
                            <span class="custom-category-text" id="inqCategoryText">결제 및 환불 문의</span>
                            <span class="custom-category-icon">
                              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                              </svg>
                            </span>
                          </div>
                          <div class="custom-category-options" id="inqCategoryOptions">
                            <div class="custom-category-option active" data-value="payment">결제 및 환불 문의</div>
                            <div class="custom-category-option" data-value="gate">게이트 출입 / QR 오류</div>
                            <div class="custom-category-option" data-value="order">F&B O2O 주문 취소</div>
                            <div class="custom-category-option" data-value="other">기타 안내사항</div>
                          </div>
                        </div>
                        <select class="form-select" id="inqCategory" style="display:none;">
                          <option value="payment">결제 및 환불 문의</option>
                          <option value="gate">게이트 출입 / QR 오류</option>
                          <option value="order">F&B O2O 주문 취소</option>
                          <option value="other">기타 안내사항</option>
                        </select>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">문의 제목</label>
                        <input type="text" class="form-control" id="inqTitle" placeholder="문의 사항의 제목을 적어주세요." />
                      </div>
                      <div class="mb-4">
                        <label class="form-label">문의 상세 내용</label>
                        <textarea class="form-control" id="inqContent" rows="6"
                          placeholder="상담원이 빠른 파악을 할 수 있도록 정확한 상점명 및 주문 번호 등을 적어주시면 큰 도움이 됩니다."></textarea>
                      </div>
                      <button type="button" class="btn btn-primary w-100" id="submitInquiryBtn">1:1 문의 신청하기</button>

                  </div>
