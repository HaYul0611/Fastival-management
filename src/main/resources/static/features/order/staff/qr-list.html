<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장 발권 내역 (QR) | FESTIO</title>
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar" class="collapsed">
      <div class="sidebar-header">
        <span class="sidebar-title" style="background: linear-gradient(90deg, #38bdf8, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 1px;">FESTIO STAFF SYSTEM</span>
      </div>
      <ul class="sidebar-menu">
        <!-- Loaded dynamically from /features/user/staff/menu_aside.html -->
      </ul>
    </aside>

    <main id="main-container">
      <header id="header">
        <button id="toggle-sidebar-btn" class="header-menu-btn">≡</button>
        <div id="header-checkpoint">티켓 관리</div>
        <div class="header-actions">
          <span id="header-user">인증 대기 중</span>
          <button id="logout-btn">로그아웃</button>
        </div>
      </header>

      <div id="main-content">
        <section class="content-view active">
          <div class="panel-rigid">
            <div class="panel-header-rigid">현장 발권 및 QR 티켓 목록 (DB 연동)</div>
            <div class="panel-body-rigid">
              <p>Supabase 데이터베이스에 실시간으로 저장된 발급 완료 QR 코드 및 티켓 내역을 조회합니다.</p>
              <button id="btn-load-qr" class="btn btn-rigid btn-small btn-blue">새로고침</button>
              <div id="qr-list-container" style="margin-top: 20px;">
                <!-- QR lists will be displayed here dynamically -->
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/qr-list.js"></script>
</body>
</html>
