<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장 발권 내역 (QR) | FESTIO</title>
  <link rel="stylesheet" href="/assets/css/custom.css">
  <script type="module">
    import { injectLayout } from '/assets/js/layout.js';
    injectLayout();
  </script>
</head>
<body>
  <div id="app-shell">
    

    <main id="main-container">
      

      <div id="main-content">
        <section class="content-view active">
          <div class="panel-rigid">
            <div class="panel-header-rigid">현장 발권 및 QR 티켓 목록 (DB 연동)</div>
            <div class="panel-body-rigid">
              <p>Supabase 데이터베이스에 실시간으로 저장된 발급 완료 QR 코드 및 티켓 내역을 조회합니다.</p>
              <button id="btn-load-qr" class="btn btn-rigid btn-small btn-blue">새로고침</button>
              <div id="qr-list-container" style="margin-top: 20px;">
                <!-- QR lists will be displayed here dynamically -->
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/qr-list.js"></script>
</body>
</html>
