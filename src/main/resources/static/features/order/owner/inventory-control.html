<script>
  document.querySelectorAll('.status-toggle').forEach(item => {
    item.addEventListener('change', function(e) {
      const label = e.target.nextElementSibling;
      if(e.target.checked) {
        label.innerText = "판매중";
        label.className = "form-check-label text-success";
        alert("🟢 해당 상품의 O2O 판매가 즉각 재개되었습니다.");
      } else {
        label.innerText = "수동 품절";
        label.className = "form-check-label text-danger";
        alert("🔴 해당 상품의 모바일 APP 노출이 정지되었으며 [수동 품절] 처리되었습니다.");
      }
    });
  });
</script>
