<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>계정 찾기 | FESTIO</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/find-account.css">
</head>

<body>

  <script src="js/components/sidePanel.js"></script>

  <!-- ══ 헤더 ═══════════════════════════════════════════════════ -->
  <header class="app-header">
    <button class="header-hamburger" id="hamburgerBtn" aria-label="전체 메뉴 열기" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <a href="index.html" class="header-logo" aria-label="FESTIO 홈">
      <span class="header-logo-text">FESTIO</span>
    </a>
    <div class="header-spacer"></div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="page-body find-account-body">
    <div class="find-container">
      <div class="back-btn-wrap">
        <a href="login.html" class="back-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          로그인 화면으로 돌아가기
        </a>
      </div>

      <div class="find-card">
        <div class="find-header">
          <h1 class="find-title">계정 찾기</h1>
          <p class="find-subtitle">아이디와 비밀번호를 잊으셨나요?</p>
        </div>

        <!-- 탭 메뉴 -->
        <div class="tab-menu" role="tablist">
          <button class="tab-btn active" id="tabFindId" role="tab" aria-selected="true" aria-controls="panelFindId">아이디
            찾기</button>
          <button class="tab-btn" id="tabFindPw" role="tab" aria-selected="false" aria-controls="panelFindPw">비밀번호
            찾기</button>
        </div>

        <!-- 아이디 찾기 패널 -->
        <div class="tab-panel active" id="panelFindId" role="tabpanel" aria-labelledby="tabFindId">
          <form id="findIdForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="findIdName">이름</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input type="text" id="findIdName" class="form-input" placeholder="가입한 이름 입력" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="findIdPhone">연락처 (휴대폰 번호)</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" />
                </svg>
                <input type="tel" id="findIdPhone" class="form-input" placeholder="- 없이 숫자만 입력" maxlength="11" required>
              </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmitFindId">아이디 찾기</button>
          </form>

          <!-- 아이디 찾기 결과 (초기 숨김) -->
          <div class="result-section hidden" id="resultIdSection">
            <h3 class="result-title">아이디 찾기 결과</h3>
            <p class="result-text">고객님의 정보와 일치하는 아이디입니다.</p>
            <div class="result-box">
              <span class="found-id" id="foundIdValue">example@festio.com</span>
              <span class="join-date">가입일: 2026.01.01</span>
            </div>
            <a href="login.html" class="btn-submit">로그인하러 가기</a>
          </div>
        </div>

        <!-- 비밀번호 찾기 패널 -->
        <div class="tab-panel" id="panelFindPw" role="tabpanel" aria-labelledby="tabFindPw">
          <form id="findPwForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="findPwName">이름</label>
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <input type="text" id="findPwName" class="form-input" placeholder="가입한 이름 입력" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="findPwEmail">아이디 (이메일 주소)</label>
              <div class="auth-input-wrapper">
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                  <input type="email" id="findPwEmail" class="form-input" placeholder="가입한 아이디(이메일)" required>
                </div>
                <button type="button" class="btn-auth" id="btnSendPwCode">인증번호 발송</button>
              </div>
            </div>

            <div class="form-group auth-section hidden" id="authPwSection">
              <label class="form-label" for="authPwCode">인증번호</label>
              <div class="auth-input-wrapper">
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                  </svg>
                  <input type="text" id="authPwCode" class="form-input" placeholder="인증번호 6자리 입력" maxlength="6">
                  <span class="auth-timer" id="authPwTimer">03:00</span>
                </div>
                <button type="button" class="btn-auth-confirm" id="btnConfirmPwCode">확인</button>
              </div>
              <div class="auth-status" id="authPwStatus"></div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmitFindPw" disabled>비밀번호 재설정하기</button>
          </form>

          <!-- 비밀번호 재설정 결과/입력폼 (초기 숨김) -->
          <div class="result-section hidden" id="resultPwSection">
            <h3 class="result-title" style="margin-bottom: 24px;">새 비밀번호 재설정</h3>
            <form id="resetPwForm" novalidate>
              <div class="form-group text-left" style="text-align: left;">
                <label class="form-label" for="resetPassword">새 비밀번호</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0110 0v4" />
                  </svg>
                  <input type="password" id="resetPassword" class="form-input" placeholder="새 비밀번호 입력" required>
                </div>
              </div>
              <div class="form-group text-left" style="text-align: left;">
                <label class="form-label" for="resetPasswordConfirm">새 비밀번호 확인</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0110 0v4" />
                  </svg>
                  <input type="password" id="resetPasswordConfirm" class="form-input" placeholder="새 비밀번호 다시 입력"
                    required>
                </div>
              </div>
              <button type="button" class="btn-submit" id="btnResetPwSubmit">비밀번호 변경 완료</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 가입 내역 없음 팝업 모달 -->
  <div class="modal-overlay" id="notFoundModal"
    style="display:none; z-index: 9999; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);">
    <div class="modal-content"
      style="background: #fff; padding: 32px; border-radius: 16px; text-align: center; max-width: 320px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; margin-top:0;">가입 내역 없음</h3>
      <p style="font-size: 0.9375rem; color: #64748b; margin-bottom: 24px;">해당 이름과 연락처로 가입한 내역이 없습니다.<br>회원가입을 진행하시겠습니까?
      </p>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn-submit outline" id="btnCancelNotFound"
          style="flex:1; margin-top:0; height:48px;">취소</button>
        <a href="register.html" class="btn-submit" style="flex:1; margin-top:0; height:48px;">회원가입</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/find-account.js"></script>
</body>

</html>
