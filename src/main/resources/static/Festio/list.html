<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모든 행사 | FESTIO</title>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/list.css">
</head>

<body>
  <script src="js/components/sidePanel.js"></script>

  <!-- ══ 헤더 ═══════════════════════════════════════════════════ -->
  <script src="js/components/appHeader.js"></script>

  <!-- 모바일 검색 모달 -->
  <div class="modal-overlay modal-center" id="modal-mobile-search" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header search-modal-header"
        style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:18px; font-weight:bold; margin:0;">통합 검색</h3>
        <button class="modal-close-btn" data-close-modal="modal-mobile-search" aria-label="닫기"
          style="width:32px; height:32px; background:rgba(255,255,255,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="width:18px; height:18px;">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="mobile-search-form">
          <div class="mobile-search-input-wrap">
            <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="search" class="filter-range-input mobile-search-input" id="mobileSearchInput"
              placeholder="행사명, 아티스트 검색" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
          </div>
          <button class="btn btn-pastel-blue" id="btn-mobile-search-execute">검색</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast-container" aria-live="polite"></div>

  <main class="page-body" id="mainContent">
    <!-- 새로운 카테고리 비주얼 배너 및 서브 카테고리 (LNB) 영역 -->
    <div id="category-visual-header"></div>

    <!-- 전체 그리드 섹션 -->
    <section class="poster-section" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
      <div class="list-sort-bar"
        style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;">
        <div class="sort-tabs" style="display: flex; gap: 1.5rem; justify-content: center; margin-bottom: 1.5rem;">
          <button class="sort-tab active" data-sort="popular"
            style="background:none; border:none; color:var(--text-main); font-weight:bold; cursor:pointer;">주간랭킹순</button>
          <span style="color:var(--border-subtle);">|</span>
          <button class="sort-tab" data-sort="new"
            style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">신상품순</button>
          <span style="color:var(--border-subtle);">|</span>
          <button class="sort-tab" data-sort="closing"
            style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">종료임박순</button>
          <span style="color:var(--border-subtle);">|</span>
          <button class="sort-tab" data-sort="name"
            style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">상품명순</button>
        </div>
        <div class="list-total-count" style="text-align: center; color: var(--text-base); font-size: 15px;">
          현재 예매 가능한 공연은 총 <strong id="totalCount" style="color: #ff5b29;">0</strong>개 입니다.
        </div>
      </div>
      <div class="poster-grid" id="bento-grid" aria-label="행사 목록"></div>
    </section>

    <!-- Bottom Navigation -->
    <script src="js/components/bottomNav.js"></script>
  </main>

  <!-- Supabase JS -->
  <script src="js/components/appFooter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JavaScript -->
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/list.js"></script>
  <script src="js/recent-carousel.js"></script>
</body>

</html>
