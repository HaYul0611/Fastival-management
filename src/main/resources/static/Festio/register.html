<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>회원가입 | FESTIO</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/register.css">
</head>

<body>

  <script src="js/components/sidePanel.js"></script>

  <!-- ══ 헤더 ═══════════════════════════════════════════════════ -->
  <header class="app-header">
    <!-- 햄버거 -->
    <button class="header-hamburger" id="hamburgerBtn" aria-label="전체 메뉴 열기" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- 로고 -->
    <a href="index.html" class="header-logo" aria-label="FESTIO 홈">
      <span class="header-logo-text">FESTIO</span>
    </a>

    <!-- 데스크톱 카테고리 네비 -->
    <nav class="header-cat-nav" aria-label="주요 카테고리">
      <button class="header-cat-item" data-cat="concert">콘서트,
        <svg class="icon cat-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="concert" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="concert" data-sub="domestic"><span>국내뮤지션</span></a>
          <a class="cat-dropdown-item" data-cat="concert" data-sub="overseas"><span>해외뮤지션</span></a>
          <a class="cat-dropdown-item" data-cat="concert" data-sub="festival"><span>페스티벌</span></a>
        </div>
      </button>
      <button class="header-cat-item" data-cat="musical">뮤지컬</button>
      <button class="header-cat-item" data-cat="play">연극</button>
      <button class="header-cat-item" data-cat="classic">클래식/무용
        <svg class="icon cat-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="classic" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="classic" data-sub="classic"><span>클래식</span></a>
          <a class="cat-dropdown-item" data-cat="classic" data-sub="ballet"><span>발레/무용</span></a>
          <a class="cat-dropdown-item" data-cat="classic" data-sub="gukak"><span>국악</span></a>
        </div>
      </button>
      <button class="header-cat-item" data-cat="exhibition">전시/스포츠
        <svg class="icon cat-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <div class="cat-dropdown">
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="all"><span>전체보기</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="exhibition"><span>전시</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="experience"><span>체험/행사</span></a>
          <a class="cat-dropdown-item" data-cat="exhibition" data-sub="sports"><span>스포츠</span></a>
        </div>
      </button>
      <button class="header-cat-item" data-cat="family">가족/어린이</button>
      <button class="header-cat-item" data-cat="local">지역축제</button>
      <button class="header-cat-item" data-cat="univ">대학축제</button>
      <button class="header-cat-item" data-cat="expo">박람회</button>
    </nav>

    <div class="header-spacer"></div>

    <!-- 액션 버튼 -->
    <div class="header-actions">
      <a href="mypage.html" class="header-text-btn" aria-label="MY티켓">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h6" />
          <path d="M14 4h6v6" />
          <path d="M10 14L20 4" />
        </svg>
        MY티켓
      </a>
      <!-- 데스크톱 검색 -->
      <div class="header-search-bar" role="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" class="header-search-input" id="headerSearch" placeholder="행사명, 아티스트 검색" autocomplete="new-password"
          aria-label="검색">
      </div>
      <!-- 모바일 검색 -->
      <button class="header-icon-btn mobile-search-btn" aria-label="검색">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
      <!-- 알림 -->
      <button class="header-icon-btn" aria-label="알림">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 01-3.46 0" />
        </svg>
      </button>
      <!-- 마이페이지 / 로그인 스와핑 타겟 -->
      <a href="mypage.html" class="header-icon-btn" aria-label="마이페이지">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
    </div>
  </header>

  <!-- 메인 회원가입 컨텐츠 영역 -->
  <main class="page-body register-page-body">
    <div class="register-container">
      <div class="back-btn-wrap">
        <a href="login.html" class="back-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          로그인 화면으로 돌아가기
        </a>
      </div>

      <div class="register-card">
        <div class="register-header">
          <div class="register-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#gradient-icon)" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <defs>
                <linearGradient id="gradient-icon" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#667eea" />
                  <stop offset="100%" style="stop-color:#764ba2" />
                </linearGradient>
              </defs>
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <h1 class="register-logo">FESTIO</h1>
          <p class="register-subtitle">통합 브랜드 신규 회원가입</p>
        </div>

        <form id="registerForm" novalidate>
          <!-- 이메일 주소 -->
          <div class="form-group">
            <label class="form-label" for="registerEmail">이메일 주소 (아이디)</label>
            <div class="auth-input-wrapper">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <input type="email" id="registerEmail" class="form-input" placeholder="example@festio.com" required>
              </div>
              <button type="button" class="btn-auth" id="btnSendAuthCode">인증번호 발송</button>
            </div>
          </div>

          <!-- 이메일 인증 (초기 숨김) -->
          <div class="form-group auth-section hidden" id="authCodeSection">
            <label class="form-label" for="emailAuthCode">이메일 인증번호</label>
            <div class="auth-input-wrapper">
              <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                  <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
                <input type="text" id="emailAuthCode" class="form-input" placeholder="인증번호 6자리 입력" maxlength="6">
                <span class="auth-timer" id="authTimer">03:00</span>
              </div>
              <div class="auth-buttons">
                <button type="button" class="btn-auth-sub" id="btnResendAuthCode">재발송</button>
                <button type="button" class="btn-auth-confirm" id="btnConfirmAuthCode">확인</button>
              </div>
            </div>
            <div class="auth-status" id="authStatus"></div>
          </div>

          <!-- 본명 -->
          <div class="form-group">
            <label class="form-label" for="registerName">이름 (실명)</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input type="text" id="registerName" class="form-input" placeholder="실명을 입력해주세요" required>
            </div>
          </div>

          <!-- 주민등록번호 -->
          <div class="form-group">
            <label class="form-label" for="registerRRN1">주민등록번호</label>
            <div style="display:flex; align-items:center; gap:8px;">
              <input type="text" id="registerRRN1" class="form-input" placeholder="앞 6자리" maxlength="6"
                style="width:40%; text-align:center;" required>
              <span style="color:#9ca3af; font-weight:bold;">-</span>
              <input type="text" id="registerRRN2" class="form-input" placeholder="뒤 7자리" maxlength="7"
                style="width:60%; letter-spacing:2px;" required>
            </div>
          </div>

          <!-- 휴대폰 번호 -->
          <div class="form-group">
            <label class="form-label" for="registerPhone">휴대폰 번호</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" />
              </svg>
              <input type="tel" id="registerPhone" class="form-input" placeholder="010-1234-5678" maxlength="13"
                required>
            </div>
          </div>

          <!-- 비밀번호 -->
          <div class="form-group">
            <div class="label-with-indicator">
              <label class="form-label" for="registerPassword">비밀번호</label>
              <span class="pw-strength-text hidden" id="pwStrengthText"></span>
            </div>
            <div class="input-wrapper password-group">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <input type="password" id="registerPassword" class="form-input" placeholder="••••••••" required>
              <button type="button" class="btn-toggle-pw" id="togglePassword" aria-label="비밀번호 표시">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <div class="pw-strength-bar hidden" id="pwStrengthBar">
              <div class="pw-strength-fill" id="pwStrengthFill"></div>
            </div>
            <p class="pw-helper-text">대문자+특수문자(!,@,#,$,%,^,&,*)+숫자 조합 8자리 이상</p>
            <p class="pw-error-text hidden" id="pwErrorText">비밀번호 다시 입력확인이 필요합니다.</p>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="form-group">
            <label class="form-label" for="registerConfirmPassword">비밀번호 확인</label>
            <div class="input-wrapper password-group">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              <input type="password" id="registerConfirmPassword" class="form-input" placeholder="••••••••" required>
              <button type="button" class="btn-toggle-pw" id="toggleConfirmPassword" aria-label="비밀번호 표시">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- 약관 동의 -->
          <div class="terms-section">
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeAll" required>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">전체 동의</span>
              </label>
            </div>
            <div class="terms-divider"></div>
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeTerms" required>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">이용약관 동의 <span class="required">(필수)</span></span>
              </label>
              <a href="terms.html" class="terms-link" target="_blank">보기</a>
            </div>
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreePrivacy" required>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">개인정보처리방침 동의 <span class="required">(필수)</span></span>
              </label>
              <a href="privacy.html" class="terms-link" target="_blank">보기</a>
            </div>
            <div class="terms-checkbox-wrapper">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeMarketing">
                <span class="checkmark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </span>
                <span class="checkbox-text">마케팅 정보 수신 동의 <span class="optional">(선택)</span></span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn-register">회원가입 완료</button>
        </form>

        <div class="social-login-section">
          <div class="social-divider">
            <span>또는 간편 가입하기</span>
          </div>
          <div class="social-btn-group">
            <button type="button" class="btn-social btn-naver" id="btnSocialRegister">
              <svg class="social-icon-svg" viewBox="0 0 24 24" fill="#FFFFFF">
                <path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z" />
              </svg>
              네이버 아이디로 가입
            </button>
            <button type="button" class="btn-social btn-kakao" id="btnSocialRegister">
              <svg class="social-icon-svg" viewBox="0 0 24 24" fill="#000000">
                <path
                  d="M12 3c-5.5 0-10 3.5-10 7.8 0 2.8 1.8 5.2 4.6 6.5l-1 3.7c-.1.4.3.7.6.5l4.3-2.9c.5.1 1 .1 1.5.1 5.5 0 10-3.5 10-7.8S17.5 3 12 3z" />
              </svg>
              카카오 아이디로 가입
            </button>
            <button type="button" class="btn-social btn-google" id="btnSocialRegister">
              <svg class="social-icon-svg" viewBox="0 0 24 24">
                <path fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
              </svg>
              구글 아이디로 가입
            </button>
            <button type="button" class="btn-social btn-toss" id="btnSocialRegister">
              <img src="https://static.toss.im/icons/svg/icon-toss-logo.svg" alt="Toss 로고" class="social-icon-svg" />
              토스 아이디로 가입
            </button>
          </div>
        </div>

        <div class="register-footer">
          이미 계정이 있으신가요? <a href="login.html">로그인하기</a>
        </div>
      </div>
    </div>
  </main>

  <!-- ══ 하단 네비 (모바일) ════════════════════════════════════ -->
  <nav class="bottom-nav" aria-label="하단 메뉴">
    <a href="index.html" class="bottom-nav-item" aria-label="홈">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      홈
    </a>
    <a href="list.html" class="bottom-nav-item" aria-label="전체행사">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
      </svg>
      전체행사
    </a>
    <button class="bottom-nav-item" aria-label="검색">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      검색
