  <!-- ═══ INTERACTIVE SCRIPT ═══ -->
  <script type="text/javascript"><![CDATA[
    var selected = null;

    function selectZone(el) {
      // 같은 구역 재클릭 시 선택 해제
      if (selected === el) {
        el.classList.remove('selected');
        selected = null;
        dispatchSelection(null);
        return;
      }
      // 이전 선택 해제
      if (selected) {
        selected.classList.remove('selected');
      }
      el.classList.add('selected');
      selected = el;

      var label = el.getAttribute('data-label');
      var price = el.getAttribute('data-price');
      var id    = el.getAttribute('id');

      dispatchSelection({ id: id, label: label, price: price });
    }

    // 부모 페이지로 선택 이벤트 전달 (postMessage + CustomEvent 두 방식 모두 지원)
    function dispatchSelection(data) {
      // 1) window.postMessage — iframe 환경에서 부모로 전달
      try {
        window.parent.postMessage({ type: 'seatingMapSelect', payload: data }, '*');
      } catch(e) {}

      // 2) CustomEvent — 같은 document 내에서 직접 사용 시
      try {
        var evt = new CustomEvent('seatingMapSelect', { detail: data, bubbles: true });
        document.dispatchEvent(evt);
      } catch(e) {}
    }
  ]]></script>
</svg>
